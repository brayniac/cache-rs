name: CI

on:
  push:
    branches: [main, hardening]
  pull_request:
    branches: [main, hardening]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The full job takes ~5 minutes warm; without a cap a wedged runner or a
    # rare test livelock holds the job for the 360-minute default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace

      - name: Test with debug feature
        run: cargo test -p segcache --features debug

      # `tests/copy_into_relink_failure.rs` covers `Segment::copy_into`'s
      # `RelinkFailure` abort path, which no workload can reach (the relink CAS
      # can only lose to an unpinned unlink landing in a few tens of
      # nanoseconds). It drives the abort with the `fault-injection` knob and
      # needs `debug` for `items()`. Neither feature is default, so without
      # this step that file compiles to an empty binary and the path goes
      # untested. Scoped to the one binary: the rest of the suite is already
      # covered by the steps above, and this still compiles the lib under the
      # new feature combination, so the gating is validated either way.
      - name: Test copy_into abort accounting (fault injection)
        run: cargo test -p segcache --features fault-injection,debug --test copy_into_relink_failure

      # `src/revalidation_tests.rs` covers `get_pinned`'s post-pin revalidation
      # retry (#65). The race needs a writer republishing the key inside a
      # reader's lookup -> revalidate window, which no test can schedule, so it
      # drives that window from the `fault-injection` hooks instead. Same
      # gating story as the step above: without this the module compiles to
      # nothing. Scoped by name — the rest of the lib suite already ran.
      - name: Test revalidation retry (fault injection)
        run: cargo test -p segcache --features fault-injection --lib revalidation_tests

      - name: Test with loom
        run: cargo test -p segcache --features loom -- loom

      # Shuttle is the complement of loom: randomized schedules under
      # sequential consistency, which lets the models assert the
      # SC-total-order (Dekker) invariants loom structurally cannot — a
      # pinned reader/writer/remover never coexists with a committed drain,
      # and the condemned-segment handoff neither leaks nor double-frees.
      # Loom stays the only check on ordering STRENGTH (shuttle treats every
      # ordering as SeqCst). The name filter matters: model-backend sync
      # primitives panic outside their runner.
      - name: Test with shuttle
        run: cargo test -p segcache --features shuttle -- shuttle_

  # ThreadSanitizer over the concurrent test suite. TSan models atomics
  # correctly (no reports from the freq counters, seqlock, or pin
  # protocols — all expressed through atomics) and flags exactly the
  # non-atomic racing accesses; the issue #61 spike found it surfaces in
  # one ordinary 16s run what the stress tests need thousands of runs to
  # hit once. One suppression is loaded (tsan-suppressions.txt): the
  # accepted unpinned-verify byte race, tracked for removal in issue #91.
  # halt_on_error makes any OTHER report fail the job.
  #
  # Skips: full_cache_long* are single-threaded throughput soaks with zero
  # concurrency value under a race detector (they dominate the runtime
  # ~20x); cas_incr_stress_exact_accounting assumes eviction-pressure
  # timing that TSan's slowdown distorts (it runs in the normal matrix
  # above). --tests skips doctests, whose rustdoc invocations don't get
  # the sanitizer ABI flags under -Zbuild-std.
  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-Zsanitizer=thread"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tsan-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-tsan-

      - name: Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: "halt_on_error=1 suppressions=${{ github.workspace }}/tsan-suppressions.txt"
        run: >
          cargo +nightly test -p segcache -Zbuild-std
          --target x86_64-unknown-linux-gnu --features debug --tests --
          --skip full_cache_long --skip cas_incr_stress_exact_accounting

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format
        run: cargo fmt --all --check
