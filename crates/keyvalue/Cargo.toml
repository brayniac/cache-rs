[package]
name = "keyvalue"
version = "0.4.0"
description = "Shared key-value item types for cache storage engines"

edition = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[features]
# The seqlock writer-lock discipline on numeric in-place updates: incr/
# decr serialize on the item's version word (odd = write in progress),
# which is what lets an engine's cas publish path exclude concurrent
# increments by holding `lock_numeric_version`. LOAD-BEARING for cas
# linearization — on by default, and engines that need it (segcache)
# require it explicitly rather than relying on the default.
default = ["numeric-seqlock"]
numeric-seqlock = []
# Corruption diagnostics: magic bytes + a CRC32 over the item, computed
# at define time and re-computed on every in-place numeric update.
# Implies numeric-seqlock: value and CRC are two words that must change
# as one seqlocked unit. NOT default — the CRC costs a whole-item hash
# on every insert (~27% of set time when it was unconditionally on).
integrity = ["numeric-seqlock", "crc32fast"]
debug = ["integrity"]

[dependencies]
crc32fast = { workspace = true, optional = true }

# `--cfg kani` is set by the Kani driver when verifying the #[kani::proof]
# harnesses; declare it so normal builds don't flag the cfg as unexpected.
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(kani)"]
